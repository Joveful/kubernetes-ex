apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: ping-vol
          emptyDir: {}
      containers:
        - name: pingpong
          image: joveful/pingpong3
          volumeMounts:
          - mountPath: /usr/src/app/files
            name: ping-vol