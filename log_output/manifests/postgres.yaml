apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: exercises
type: Opaque
stringData:
  POSTGRES_DB: pingpong
  POSTGRES_USER: pingpong
  POSTGRES_PASSWORD: my-epic-pw
  DATABASE_URL: postgres://pingpong:change-me@postgres:5432/pingpong

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: exercises
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: exercises
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        # k3s/k3d provides the local-path StorageClass.
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi