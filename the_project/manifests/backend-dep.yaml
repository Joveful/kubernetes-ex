apiVersion: apps/v1
kind: Deployment
metadata:
  name: todobackend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todobackend
  template:
    metadata:
      labels:
        app: todobackend
    spec:
      containers:
        - name: todoapp
          image: joveful/todo-backend1
          env:
          - name: PORT
            value: "4000"