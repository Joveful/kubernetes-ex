apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: wikipedia-todo
              image: node:22-alpine
              env:
                - name: TODO_API_URL
                  value: http://todo-backend-svc:3457/todos
              command:
                - node
                - --input-type=module
                - -e
                - |
                  const article = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary', {
                    headers: { 'User-Agent': 'todo-app-wikipedia-cronjob/1.0' }
                  }).then(async (response) => {
                    if (!response.ok) throw new Error(`Wikipedia request failed: ${response.status}`)
                    return response.json()
                  })
                  const url = article.content_urls?.desktop?.page
                  if (!url) throw new Error('Wikipedia response did not contain an article URL')

                  const response = await fetch(process.env.TODO_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: `Read ${url}` })
                  })
                  if (!response.ok) throw new Error(`Todo API request failed: ${response.status}`)
                  console.log(`Created todo: Read ${url}`)
